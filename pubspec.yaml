name: pet_passport
description: "Pet Passport - lokale Verwaltung von Haustieren"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Persistence
  drift: ^2.21.0
  drift_flutter: ^0.2.4

  # Navigation
  go_router: ^14.6.2

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.4

  # External apps (phone / mail / maps)
  url_launcher: ^6.3.1

  # Open stored documents (PDF/images) with system viewer
  open_filex: ^4.5.0

  # Local notifications for vaccinations / appointments / medications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # Emergency QR card
  qr_flutter: ^4.1.0

  # Share generated backup files (JSON export)
  share_plus: ^10.0.2

  # Biometric app-lock
  local_auth: ^2.3.0

  # Utility
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: any
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.13
  drift_dev: ^2.21.2
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0

  # Lint
  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
